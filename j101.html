<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JapanesePod101 Video Directory</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    };
  </script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen transition-colors duration-200">

  <div class="max-w-6xl mx-auto px-4 py-8">
    
    <!-- Header Area -->
    <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 pb-6 border-b border-gray-200 dark:border-gray-800 mb-6">
      <div>
        <div class="flex items-center gap-3">
          <h1 class="text-3xl font-extrabold flex items-center gap-2">
            <span>👍</span>
            <a href="https://www.youtube.com/@JapanesePod101/videos" target="_blank" class="hover:text-red-600 transition-colors">
              JapanesePod101
            </a>
          </h1>
          <!-- Total Links Counter Badge -->
          <span id="totalBadge" class="px-2.5 py-1 text-xs font-bold rounded-full bg-red-100 dark:bg-red-950 text-red-600 dark:text-red-400 border border-red-200 dark:border-red-900">
            0 Links
          </span>
        </div>
        <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Updated as of 22 Aug 2026 • Powered by External JSON Data</p>
      </div>

      <!-- Controls Right: Dark Mode Switch -->
      <button id="themeToggle" class="px-4 py-2 rounded-lg bg-gray-200 dark:bg-gray-800 text-gray-700 dark:text-gray-200 hover:bg-gray-300 dark:hover:bg-gray-700 text-sm font-medium transition-colors flex items-center gap-2">
        <span id="themeIcon">🌙</span>
        <span id="themeText">Dark Mode</span>
      </button>
    </header>

    <!-- Navigation Bar: Search & Category Filters -->
    <div class="flex flex-col md:flex-row justify-between items-stretch md:items-center gap-4 mb-8">
      
      <!-- Category Filter Pills with Counters -->
      <div class="flex flex-wrap gap-2 max-h-36 overflow-y-auto pr-2" id="categoryContainer">
        <!-- Filter buttons render dynamically -->
      </div>

      <!-- Search Input -->
      <div class="w-full md:w-72 shrink-0">
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Search videos..." 
          class="w-full px-4 py-2 rounded-lg border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-red-500 text-sm"
        />
      </div>
    </div>

    <!-- Active Count Display -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 mb-4 text-xs font-semibold text-gray-500 dark:text-gray-400 tracking-wider uppercase">
      <span id="resultsCount">Loading dataset...</span>
      <div class="flex items-center gap-2">
        <span>Items per page:</span>
        <select id="pageSizeSelect" class="bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded px-2 py-1 text-xs text-gray-700 dark:text-gray-300 focus:outline-none">
          <option value="24">24</option>
          <option value="48" selected>48</option>
          <option value="96">96</option>
          <option value="200">200</option>
        </select>
      </div>
    </div>

    <!-- Video Grid -->
    <div id="videoGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      <!-- Cards render via JavaScript -->
    </div>

    <!-- Pagination Controls -->
    <div class="flex justify-center items-center gap-2 mt-8 pb-12" id="paginationContainer">
      <!-- Pagination buttons render dynamically -->
    </div>

  </div>

  <script>
    let videos = [];
    let categoryCounts = {};
    let categories = ['All'];
    let currentCategory = 'All';
    let searchQuery = '';
    let currentPage = 1;
    let pageSize = 48;

    // DOM Elements
    const gridEl = document.getElementById('videoGrid');
    const categoryContainer = document.getElementById('categoryContainer');
    const searchInput = document.getElementById('searchInput');
    const resultsCount = document.getElementById('resultsCount');
    const totalBadge = document.getElementById('totalBadge');
    const paginationContainer = document.getElementById('paginationContainer');
    const pageSizeSelect = document.getElementById('pageSizeSelect');
    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    const themeText = document.getElementById('themeText');

    // 1. Fetch JSON Data
    async function loadVideoData() {
      try {
        const response = await fetch('videos.json');
        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
        videos = await response.json();
        
        // Calculate Category Counts Dynamically from imported JSON
        categoryCounts = videos.reduce((acc, video) => {
          const category = video.category || "Uncategorized";
          acc[category] = (acc[category] || 0) + 1;
          return acc;
        }, {});

        categories = ['All', ...Object.keys(categoryCounts)];

        renderCategories();
        renderVideos();
      } catch (error) {
        gridEl.innerHTML = `
          <div class="col-span-full py-12 text-center text-red-500 font-medium">
            Failed to load <code>videos.json</code>. Please make sure the JSON file exists in the same directory and you are serving the page via a local/web server.
          </div>
        `;
      }
    }

    // 2. Render Categories Filter with Counts
    function renderCategories() {
      categoryContainer.innerHTML = categories.map(cat => {
        const count = cat === 'All' ? videos.length : categoryCounts[cat];
        return `
          <button 
            onclick="selectCategory('${cat}')" 
            class="px-3 py-1.5 rounded-full text-xs font-semibold transition-all flex items-center gap-1.5 shrink-0 ${
              currentCategory === cat 
                ? 'bg-red-600 text-white shadow-sm' 
                : 'bg-white dark:bg-gray-800 text-gray-600 dark:text-gray-300 border border-gray-200 dark:border-gray-700 hover:bg-gray-100 dark:hover:bg-gray-700'
            }"
          >
            <span>${cat}</span>
            <span class="${
              currentCategory === cat 
                ? 'bg-red-700 text-white' 
                : 'bg-gray-100 dark:bg-gray-700 text-gray-500 dark:text-gray-400'
            } px-1.5 py-0.2 rounded-full text-[10px]">
              ${count}
            </span>
          </button>
        `;
      }).join('');
    }

    // 3. Select Category
    window.selectCategory = function(cat) {
      currentCategory = cat;
      currentPage = 1;
      renderCategories();
      renderVideos();
    }

    // 4. Render Videos & Pagination
    function renderVideos() {
      totalBadge.textContent = `${videos.length.toLocaleString()} Links`;

      const filtered = videos.filter(v => {
        const matchesCat = currentCategory === 'All' || v.category === currentCategory;
        const matchesSearch = v.title.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesCat && matchesSearch;
      });

      const totalPages = Math.ceil(filtered.length / pageSize) || 1;
      if (currentPage > totalPages) currentPage = totalPages;

      const startIndex = (currentPage - 1) * pageSize;
      const endIndex = startIndex + pageSize;
      const paginatedItems = filtered.slice(startIndex, endIndex);

      resultsCount.textContent = `Showing ${filtered.length > 0 ? startIndex + 1 : 0}-${Math.min(endIndex, filtered.length)} of ${filtered.length.toLocaleString()} videos (Total: ${videos.length.toLocaleString()})`;

      if (filtered.length === 0) {
        gridEl.innerHTML = `
          <div class="col-span-full py-16 text-center text-gray-500 dark:text-gray-400">
            No videos found matching your search criteria.
          </div>
        `;
        paginationContainer.innerHTML = '';
        return;
      }

      gridEl.innerHTML = paginatedItems.map((v, index) => `
        <a 
          href="${v.url}" 
          target="_blank" 
          class="group block p-4 rounded-xl bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700/60 shadow-sm hover:shadow-md hover:border-red-500/50 transition-all flex flex-col justify-between"
        >
          <div>
            <div class="flex items-center justify-between gap-2 mb-2">
              <span class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded bg-red-50 dark:bg-red-950/50 text-red-600 dark:text-red-400 border border-red-100 dark:border-red-900/40">
                ${v.category}
              </span>
              <span class="text-[10px] text-gray-400">#${startIndex + index + 1}</span>
            </div>
            <h2 class="text-sm font-semibold text-gray-800 dark:text-gray-100 group-hover:text-red-600 dark:group-hover:text-red-400 transition-colors line-clamp-2">
              ${v.title}
            </h2>
          </div>
          <div class="mt-4 flex items-center text-xs text-red-600 dark:text-red-400 font-medium">
            Watch Video 
            <svg class="w-3.5 h-3.5 ml-1 transition-transform group-hover:translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
            </svg>
          </div>
        </a>
      `).join('');

      renderPagination(totalPages);
    }

    // 5. Render Pagination Controls
    function renderPagination(totalPages) {
      if (totalPages <= 1) {
        paginationContainer.innerHTML = '';
        return;
      }

      let pagesHTML = '';
      const maxVisiblePages = 5;
      let startPage = Math.max(1, currentPage - Math.floor(maxVisiblePages / 2));
      let endPage = Math.min(totalPages, startPage + maxVisiblePages - 1);

      if (endPage - startPage + 1 < maxVisiblePages) {
        startPage = Math.max(1, endPage - maxVisiblePages + 1);
      }

      pagesHTML += `<button onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled class="opacity-40 cursor-not-allowed"' : ''} class="px-3 py-1.5 rounded bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-700 text-xs font-semibold hover:bg-gray-100 dark:hover:bg-gray-700">Prev</button>`;

      if (startPage > 1) {
        pagesHTML += `<button onclick="changePage(1)" class="px-3 py-1.5 rounded bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-700 text-xs font-semibold">1</button>`;
        if (startPage > 2) pagesHTML += `<span class="px-2 text-gray-400">...</span>`;
      }

      for (let i = startPage; i <= endPage; i++) {
        pagesHTML += `
          <button onclick="changePage(${i})" class="px-3 py-1.5 rounded text-xs font-semibold transition-colors ${
            currentPage === i 
              ? 'bg-red-600 text-white shadow-sm' 
              : 'bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-700 text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700'
          }">${i}</button>
        `;
      }

      if (endPage < totalPages) {
        if (endPage < totalPages - 1) pagesHTML += `<span class="px-2 text-gray-400">...</span>`;
        pagesHTML += `<button onclick="changePage(${totalPages})" class="px-3 py-1.5 rounded bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-700 text-xs font-semibold">${totalPages}</button>`;
      }

      pagesHTML += `<button onclick="changePage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled class="opacity-40 cursor-not-allowed"' : ''} class="px-3 py-1.5 rounded bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-700 text-xs font-semibold hover:bg-gray-100 dark:hover:bg-gray-700">Next</button>`;

      paginationContainer.innerHTML = pagesHTML;
    }

    window.changePage = function(page) {
      currentPage = page;
      renderVideos();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 6. Event Listeners
    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value;
      currentPage = 1;
      renderVideos();
    });

    pageSizeSelect.addEventListener('change', (e) => {
      pageSize = parseInt(e.target.value);
      currentPage = 1;
      renderVideos();
    });

    // 7. Dark Mode Logic
    function updateThemeUI(isDark) {
      if (isDark) {
        document.documentElement.classList.add('dark');
        themeIcon.textContent = '☀️';
        themeText.textContent = 'Light Mode';
      } else {
        document.documentElement.classList.remove('dark');
        themeIcon.textContent = '🌙';
        themeText.textContent = 'Dark Mode';
      }
    }

    themeToggle.addEventListener('click', () => {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      updateThemeUI(isDark);
    });

    const savedTheme = localStorage.getItem('theme');
    if (savedTheme) {
      updateThemeUI(savedTheme === 'dark');
    } else {
      updateThemeUI(document.documentElement.classList.contains('dark'));
    }

    // Initialize App Data
    loadVideoData();
  </script>
</body>
</html>
