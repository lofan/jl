<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Japanese Dating Terms - 恋愛・デート用語</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM UMD -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone for JSX transformation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* Custom Scrollbar for dark mode aesthetic */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #121212;
    }
    ::-webkit-scrollbar-thumb {
      background: #2D3748;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #4A5568;
    }
  </style>
</head>
<body class="bg-[#121212] text-[#E0E0E0] min-h-screen font-sans antialiased selection:bg-rose-500 selection:text-white">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useMemo } = React;

    // --- Dataset ---
    const VOCAB_DATA = [
      { id: 1, kanji: "一目惚れ", romaji: "hitomebore", english: "Love at first sight", category: "Feelings", example: "彼に一目惚れしてしまった。(I fell in love with him at first sight.)" },
      { id: 2, kanji: "片思い", romaji: "kataomoi", english: "Unrequited love", category: "Feelings", example: "ずっと片思いをしている。(I've had an unrequited crush for a long time.)" },
      { id: 3, kanji: "両思い", romaji: "ryouomoi", english: "Mutual love", category: "Feelings", example: "ついに両思いになれた！(We finally have mutual feelings!)" },
      { id: 4, kanji: "蛙化現象", romaji: "kaeruka genshou", english: "Getting the 'ick'", category: "Slang / Trends", example: "彼の行動を見て蛙化現象が起きた。(I got the 'ick' after seeing how he acted.)" },
      { id: 5, kanji: "既読スルー", romaji: "kidoku suruu", english: "Left on read", category: "Communication", example: "LINEを既読スルーされた。(My LINE message was left on read.)" },
      { id: 6, kanji: "ナンパする", romaji: "nanpa suru", english: "To hit on someone", category: "Action", example: "街でナンパされた。(I got hit on in the street.)" },
      { id: 7, kanji: "告白する", romaji: "kokuhaku suru", english: "To confess love", category: "Action", example: "放課後に告白するつもりだ。(I plan to confess my feelings after school.)" },
      { id: 8, kanji: "付き合う", romaji: "tsukiau", english: "To date / go out", category: "Relationship Status", example: "先月から付き合っています。(We've been dating since last month.)" },
      { id: 9, kanji: "脈あり", romaji: "myaku ari", english: "There's a chance (Sign of interest)", category: "Slang / Trends", example: "頻繁に連絡が来るから脈ありかも。(He texts often, so there might be a chance.)" },
      { id: 10, kanji: "脈なし", romaji: "myaku nashi", english: "No chance", category: "Slang / Trends", example: "返信が遅いし、脈なしだな。(Replies are slow, so there's no chance.)" },
      { id: 11, kanji: "デートに誘う", romaji: "deeto ni sasou", english: "To ask someone out", category: "Action", example: "週末のデートに誘ってみよう。(I'll try asking them out for the weekend.)" },
      { id: 12, kanji: "奢る", romaji: "ogoru", english: "To treat to a meal", category: "Dating Etiquette", example: "今日のランチは奢るよ。(I'll treat you to lunch today.)" },
      { id: 13, kanji: "割り勘", romaji: "warikan", english: "Splitting the bill", category: "Dating Etiquette", example: "初デートは割り勘にしよう。(Let's split the bill on our first date.)" },
      { id: 14, kanji: "彼氏", romaji: "kareshi", english: "Boyfriend", category: "People", example: "彼氏はとても優しい。(My boyfriend is very kind.)" },
      { id: 15, kanji: "彼女", romaji: "kanojo", english: "Girlfriend", category: "People", example: "彼女の誕生日に花をあげた。(I gave flowers for my girlfriend's birthday.)" },
      { id: 16, kanji: "イチャイチャする", romaji: "icha icha suru", english: "To flirt / make out", category: "Action", example: "公園でイチャイチャしているカップル。(A couple flirting in the park.)" },
      { id: 17, kanji: "手をつなぐ", romaji: "te o tsunagu", english: "To hold hands", category: "Action", example: "歩きながら手をつないだ。(We held hands while walking.)" },
      { id: 18, kanji: "匂わせ", romaji: "niowase", english: "Dropping hints on SNS", category: "Slang / Trends", example: "インスタで匂わせ投稿をする。(Posting subtle hints on Instagram.)" },
      { id: 19, kanji: "すっぴん", romaji: "suppin", english: "No makeup / bare face", category: "Slang / Trends", example: "休日はすっぴんで過ごす。(I spend weekends with no makeup.)" },
      { id: 20, kanji: "遠距離恋愛", romaji: "enkyori ren'ai", english: "Long-distance relationship", category: "Relationship Status", example: "東京と大阪で遠距離恋愛中。(In a long-distance relationship between Tokyo and Osaka.)" },
      { id: 21, kanji: "浮気する", romaji: "uwaki suru", english: "To cheat / have an affair", category: "Conflict", example: "浮気が発覚して喧嘩になった。(A fight broke out after cheating was discovered.)" },
      { id: 22, kanji: "二股", romaji: "futamata", english: "Two-timing", category: "Conflict", example: "二股をかけられていた。(I was being two-timed.)" },
      { id: 23, kanji: "束縛する", romaji: "sokubaku suru", english: "To be controlling / possessive", category: "Conflict", example: "束縛しすぎるのは良くない。(Being overly controlling isn't good.)" },
      { id: 24, kanji: "冷める", romaji: "sameru", english: "To lose interest / cool off", category: "Feelings", example: "彼の態度に気持ちが冷めた。(My feelings cooled off due to his attitude.)" },
      { id: 25, kanji: "振る", romaji: "furu", english: "To dump someone", category: "Breakup", example: "理由を言って振った。(I gave a reason and dumped them.)" },
      { id: 26, kanji: "振られる", romaji: "furareru", english: "To be dumped", category: "Breakup", example: "告白したけど振られた。(I confessed, but I got dumped.)" },
      { id: 27, kanji: "元カレ", romaji: "motokare", english: "Ex-boyfriend", category: "People", example: "街で元カレに遭遇した。(I bumped into my ex-boyfriend in town.)" },
      { id: 28, kanji: "元カノ", romaji: "motokano", english: "Ex-girlfriend", category: "People", example: "元カノの写真が残っている。(Photos of my ex-girlfriend are still there.)" },
      { id: 29, kanji: "未練がある", romaji: "miren ga aru", english: "Still have feelings / attachments", category: "Feelings", example: "まだ元カノに未練がある。(I still have lingering feelings for my ex-girlfriend.)" },
      { id: 30, kanji: "復縁する", romaji: "fukuen suru", english: "To get back together", category: "Relationship Status", example: "半年ぶりに復縁した。(We got back together after half a year.)" }
    ];

    // Helper: TTS Speech Synthesis Function
    const speakText = (text, lang = 'ja-JP') => {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel(); // Stop active audio
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = lang;
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
      }
    };

    // Helper: Shuffle Array
    const shuffleArray = (arr) => {
      const array = [...arr];
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    };

    // --- Main App Component ---
    function App() {
      const [currentView, setCurrentView] = useState('menu'); // 'menu' | 'study' | 'quiz' | 'results'
      const [quizLength, setQuizLength] = useState(15);
      const [quizQuestions, setQuizQuestions] = useState([]);
      const [currentQIndex, setCurrentQIndex] = useState(0);
      const [selectedAnswer, setSelectedAnswer] = useState(null);
      const [isAnswered, setIsAnswered] = useState(false);
      const [score, setScore] = useState(0);
      const [incorrectAnswers, setIncorrectAnswers] = useState([]);
      
      // Initialize Lucide Icons after DOM updates
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      // --- Quiz Generator ---
      const startQuiz = (length) => {
        const count = Math.min(length, VOCAB_DATA.length);
        const shuffledVocab = shuffleArray(VOCAB_DATA).slice(0, count);

        const questions = shuffledVocab.map((item) => {
          // Select 3 unique distractor options
          const distractors = shuffleArray(
            VOCAB_DATA.filter((v) => v.id !== item.id)
          ).slice(0, 3);
          
          const options = shuffleArray([item, ...distractors]);

          return {
            targetItem: item,
            options: options
          };
        });

        setQuizQuestions(questions);
        setCurrentQIndex(0);
        setScore(0);
        setIncorrectAnswers([]);
        setSelectedAnswer(null);
        setIsAnswered(false);
        setCurrentView('quiz');
      };

      // --- Handle Quiz Option Selection ---
      const handleOptionClick = (option) => {
        if (isAnswered) return;

        const currentTarget = quizQuestions[currentQIndex].targetItem;
        setSelectedAnswer(option);
        setIsAnswered(true);

        // Auto play audio for term
        speakText(currentTarget.kanji);

        let isCorrect = option.id === currentTarget.id;
        if (isCorrect) {
          setScore((prev) => prev + 1);
        } else {
          setIncorrectAnswers((prev) => [
            ...prev,
            { question: currentTarget, selected: option }
          ]);
        }

        // Auto progression delay
        setTimeout(() => {
          if (currentQIndex + 1 < quizQuestions.length) {
            setCurrentQIndex((prev) => prev + 1);
            setSelectedAnswer(null);
            setIsAnswered(false);
          } else {
            setCurrentView('results');
          }
        }, 1600);
      };

      return (
        <div class="max-w-4xl mx-auto px-4 py-8 min-h-screen flex flex-col justify-between">
          {/* Header Bar */}
          <header class="flex items-center justify-between pb-6 mb-6 border-b border-gray-800">
            <div 
              onClick={() => setCurrentView('menu')}
              class="cursor-pointer flex items-center space-x-3 group"
            >
              <div class="bg-rose-500/10 p-2.5 rounded-xl border border-rose-500/20 text-rose-500 group-hover:scale-105 transition-transform">
                <i data-lucide="heart" class="w-7 h-7 fill-rose-500/20"></i>
              </div>
              <div>
                <h1 class="text-xl font-bold tracking-tight text-white group-hover:text-rose-400 transition-colors">
                  恋愛・デート用語
                </h1>
                <p class="text-xs text-gray-400">Japanese Dating Terms</p>
              </div>
            </div>

            {currentView !== 'menu' && (
              <button
                onClick={() => setCurrentView('menu')}
                class="flex items-center space-x-2 px-3 py-1.5 text-sm rounded-lg bg-gray-800 hover:bg-gray-700 text-gray-300 transition-colors"
              >
                <i data-lucide="home" class="w-4 h-4"></i>
                <span class="hidden sm:inline">Menu</span>
              </button>
            )}
          </header>

          {/* Body Dynamic View Rendering */}
          <main class="flex-grow">
            {currentView === 'menu' && (
              <MenuView 
                onStartQuiz={startQuiz} 
                onOpenStudy={() => setCurrentView('study')} 
              />
            )}

            {currentView === 'study' && (
              <StudyView vocabList={VOCAB_DATA} />
            )}

            {currentView === 'quiz' && quizQuestions.length > 0 && (
              <QuizView 
                currentQuestion={quizQuestions[currentQIndex]}
                currentIndex={currentQIndex}
                totalQuestions={quizQuestions.length}
                selectedAnswer={selectedAnswer}
                isAnswered={isAnswered}
                onSelectOption={handleOptionClick}
              />
            )}

            {currentView === 'results' && (
              <ResultsView 
                score={score}
                total={quizQuestions.length}
                incorrectAnswers={incorrectAnswers}
                onRestart={() => startQuiz(quizQuestions.length)}
                onHome={() => setCurrentView('menu')}
              />
            )}
          </main>

          {/* Footer */}
          <footer class="mt-12 text-center text-xs text-gray-500 border-t border-gray-800/60 pt-6">
            Interactive Japanese Learning Application • Native Audio via Web Speech API
          </footer>
        </div>
      );
    }

    // --- Main Menu Screen ---
    function MenuView({ onStartQuiz, onOpenStudy }) {
      return (
        <div class="space-y-8 py-4">
          {/* Welcome Banner */}
          <div class="bg-gradient-to-br from-rose-950/40 via-[#1E1E1E] to-[#1E1E1E] border border-rose-500/20 rounded-2xl p-6 sm:p-8 relative overflow-hidden shadow-xl">
            <div class="relative z-10 max-w-xl">
              <span class="inline-block px-3 py-1 bg-rose-500/10 text-rose-400 border border-rose-500/20 text-xs font-semibold rounded-full mb-3">
                30 Essential Expressions
              </span>
              <h2 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">
                Master Romance & Dating Terms
              </h2>
              <p class="mt-2 text-sm sm:text-base text-gray-400 leading-relaxed">
                Learn modern romantic slang, relationship statuses, and dating culture phrases in Japanese with native pronunciation and real-world examples.
              </p>
            </div>
            <i data-lucide="sparkles" class="absolute -right-4 -bottom-4 w-40 h-40 text-rose-500/5 pointer-events-none"></i>
          </div>

          {/* Action Grid */}
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            {/* Quiz Card Options */}
            <div class="bg-[#1E1E1E] border border-gray-800 hover:border-gray-700 rounded-2xl p-6 transition-all shadow-lg flex flex-col justify-between">
              <div>
                <div class="flex items-center space-x-3 mb-4">
                  <div class="p-2.5 bg-rose-500/10 text-rose-400 rounded-xl">
                    <i data-lucide="brain-circuit" class="w-6 h-6"></i>
                  </div>
                  <h3 class="text-lg font-bold text-white">Interactive Quiz</h3>
                </div>
                <p class="text-sm text-gray-400 mb-6">
                  Test your recognition of Kanji, Romaji, and English translations under practical scenarios.
                </p>
              </div>

              <div>
                <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">Select Question Count:</p>
                <div class="grid grid-cols-3 gap-2">
                  {[15, 20, 30].map((count) => (
                    <button
                      key={count}
                      onClick={() => onStartQuiz(count)}
                      class="py-2.5 text-sm font-semibold rounded-xl bg-gray-800 hover:bg-rose-600 hover:text-white text-gray-200 border border-gray-700 hover:border-rose-500 transition-all text-center flex justify-center items-center space-x-1"
                    >
                      <span>{count}</span>
                      <span class="text-xs font-normal opacity-75">Q's</span>
                    </button>
                  ))}
                </div>
              </div>
            </div>

            {/* Reference Table Navigation Card */}
            <div 
              onClick={onOpenStudy}
              class="bg-[#1E1E1E] border border-gray-800 hover:border-gray-700 rounded-2xl p-6 transition-all cursor-pointer shadow-lg flex flex-col justify-between group"
            >
              <div>
                <div class="flex items-center space-x-3 mb-4">
                  <div class="p-2.5 bg-rose-500/10 text-rose-400 rounded-xl group-hover:bg-rose-500 group-hover:text-white transition-colors">
                    <i data-lucide="book-open" class="w-6 h-6"></i>
                  </div>
                  <h3 class="text-lg font-bold text-white group-hover:text-rose-400 transition-colors">Study Reference</h3>
                </div>
                <p class="text-sm text-gray-400">
                  Explore all 30 Japanese dating terms organized systematically. Practice audio pronunciation and read contextual sentences.
                </p>
              </div>

              <div class="mt-6 flex items-center justify-between text-rose-400 font-semibold text-sm">
                <span>Browse Reference List</span>
                <i data-lucide="arrow-right" class="w-4 h-4 group-hover:translate-x-1 transition-transform"></i>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // --- Study Reference Screen ---
    function StudyView({ vocabList }) {
      const [searchTerm, setSearchTerm] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('All');

      // Unique categories list
      const categories = useMemo(() => {
        const set = new Set(vocabList.map(item => item.category));
        return ['All', ...Array.from(set)];
      }, [vocabList]);

      // Filtered items based on search and category
      const filteredVocab = vocabList.filter(item => {
        const matchesCategory = selectedCategory === 'All' || item.category === selectedCategory;
        const matchesSearch = 
          item.kanji.toLowerCase().includes(searchTerm.toLowerCase()) ||
          item.romaji.toLowerCase().includes(searchTerm.toLowerCase()) ||
          item.english.toLowerCase().includes(searchTerm.toLowerCase());
        return matchesCategory && matchesSearch;
      });

      return (
        <div class="space-y-6">
          <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
              <h2 class="text-2xl font-bold text-white">Reference Library</h2>
              <p class="text-xs text-gray-400">Browse terms, pronunciations, and contextual usages</p>
            </div>

            {/* Filter Controls */}
            <div class="flex flex-col sm:flex-row gap-3">
              <input
                type="text"
                placeholder="Search word or meaning..."
                value={searchTerm}
                onChange={(e) => setSearchTerm(e.target.value)}
                class="px-4 py-2 bg-[#1E1E1E] border border-gray-700 rounded-xl text-sm text-white focus:outline-none focus:border-rose-500 transition-colors"
              />
              <select
                value={selectedCategory}
                onChange={(e) => setSelectedCategory(e.target.value)}
                class="px-4 py-2 bg-[#1E1E1E] border border-gray-700 rounded-xl text-sm text-white focus:outline-none focus:border-rose-500 transition-colors"
              >
                {categories.map((cat) => (
                  <option key={cat} value={cat}>{cat}</option>
                ))}
              </select>
            </div>
          </div>

          {/* Cards Grid */}
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            {filteredVocab.map((item) => (
              <div 
                key={item.id} 
                class="bg-[#1E1E1E] border border-gray-800 hover:border-gray-700 rounded-xl p-5 transition-all flex flex-col justify-between"
              >
                <div>
                  <div class="flex items-start justify-between mb-2">
                    <div>
                      <span class="text-xs px-2.5 py-0.5 rounded-full bg-rose-500/10 text-rose-400 border border-rose-500/20">
                        {item.category}
                      </span>
                      <h3 class="text-2xl font-bold text-white mt-2">{item.kanji}</h3>
                      <p class="text-xs text-rose-400 font-mono tracking-wide">{item.romaji}</p>
                    </div>

                    <button
                      onClick={() => speakText(item.kanji)}
                      title="Listen Pronunciation"
                      class="p-2.5 bg-gray-800 hover:bg-rose-600/20 hover:text-rose-400 text-gray-300 rounded-xl transition-colors"
                    >
                      <i data-lucide="volume-2" class="w-5 h-5"></i>
                    </button>
                  </div>

                  <p class="text-sm font-semibold text-gray-200 mt-2">{item.english}</p>
                </div>

                <div class="mt-4 pt-3 border-t border-gray-800/80">
                  <p class="text-xs text-gray-400 italic">"{item.example}"</p>
                </div>
              </div>
            ))}
          </div>

          {filteredVocab.length === 0 && (
            <div class="text-center py-12 bg-[#1E1E1E] rounded-2xl border border-gray-800">
              <i data-lucide="search-x" class="w-10 h-10 text-gray-600 mx-auto mb-2"></i>
              <p class="text-gray-400">No dating terms match your criteria.</p>
            </div>
          )}
        </div>
      );
    }

    // --- Quiz Screen Component ---
    function QuizView({ currentQuestion, currentIndex, totalQuestions, selectedAnswer, isAnswered, onSelectOption }) {
      const { targetItem, options } = currentQuestion;

      // Calculate progress percentage
      const progressPercent = ((currentIndex + 1) / totalQuestions) * 100;

      return (
        <div class="max-w-2xl mx-auto space-y-6">
          {/* Header Progress Bar */}
          <div>
            <div class="flex justify-between items-center text-xs text-gray-400 mb-2">
              <span>Question {currentIndex + 1} of {totalQuestions}</span>
              <span>{Math.round(progressPercent)}% Completed</span>
            </div>
            <div class="w-full bg-gray-800 h-2 rounded-full overflow-hidden">
              <div 
                class="bg-rose-500 h-full transition-all duration-300"
                style={{ width: `${progressPercent}%` }}
              ></div>
            </div>
          </div>

          {/* Question Display Card */}
          <div class="bg-[#1E1E1E] border border-gray-800 rounded-2xl p-8 text-center shadow-xl relative">
            <span class="text-xs px-3 py-1 rounded-full bg-rose-500/10 text-rose-400 border border-rose-500/20 font-medium">
              {targetItem.category}
            </span>

            <div class="my-6">
              <h2 class="text-4xl sm:text-5xl font-black text-white tracking-tight mb-2">
                {targetItem.kanji}
              </h2>
              <p class="text-sm text-rose-400 font-mono">{targetItem.romaji}</p>
            </div>

            <button
              onClick={() => speakText(targetItem.kanji)}
              class="inline-flex items-center space-x-2 text-xs bg-gray-800 hover:bg-gray-700 text-gray-300 px-3 py-1.5 rounded-lg transition-colors"
            >
              <i data-lucide="volume-2" class="w-4 h-4"></i>
              <span>Listen</span>
            </button>
          </div>

          {/* Answer Options Grid */}
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            {options.map((option) => {
              let btnStyle = "bg-[#1E1E1E] border-gray-800 hover:border-gray-700 text-gray-200";

              if (isAnswered) {
                if (option.id === targetItem.id) {
                  btnStyle = "bg-emerald-950/60 border-emerald-500 text-emerald-200";
                } else if (selectedAnswer && option.id === selectedAnswer.id) {
                  btnStyle = "bg-rose-950/60 border-rose-500 text-rose-200";
                } else {
                  btnStyle = "bg-[#1E1E1E] border-gray-800 text-gray-600 opacity-50";
                }
              }

              return (
                <button
                  key={option.id}
                  disabled={isAnswered}
                  onClick={() => onSelectOption(option)}
                  class={`p-4 text-left border-2 rounded-xl text-sm font-medium transition-all flex items-center justify-between ${btnStyle}`}
                >
                  <span>{option.english}</span>
                  {isAnswered && option.id === targetItem.id && (
                    <i data-lucide="check-circle-2" class="w-5 h-5 text-emerald-400 shrink-0"></i>
                  )}
                  {isAnswered && selectedAnswer && option.id === selectedAnswer.id && option.id !== targetItem.id && (
                    <i data-lucide="x-circle" class="w-5 h-5 text-rose-400 shrink-0"></i>
                  )}
                </button>
              );
            })}
          </div>
        </div>
      );
    }

    // --- Results & Score Summary Screen ---
    function ResultsView({ score, total, incorrectAnswers, onRestart, onHome }) {
      const percentage = Math.round((score / total) * 100);

      return (
        <div class="max-w-2xl mx-auto space-y-8 py-4">
          {/* Main Score Board */}
          <div class="bg-[#1E1E1E] border border-gray-800 rounded-2xl p-8 text-center shadow-xl">
            <div class="inline-flex p-3 bg-rose-500/10 rounded-full text-rose-500 mb-4">
              <i data-lucide="trophy" class="w-10 h-10"></i>
            </div>

            <h2 class="text-3xl font-extrabold text-white">Quiz Completed!</h2>
            <p class="text-sm text-gray-400 mt-1">Here is how you performed on Japanese Dating Terms</p>

            <div class="my-6">
              <span class="text-6xl font-black text-rose-500">{percentage}%</span>
              <p class="text-sm font-semibold text-gray-300 mt-2">
                You scored {score} out of {total} correct
              </p>
            </div>

            <div class="flex justify-center space-x-4">
              <button
                onClick={onRestart}
                class="px-6 py-3 rounded-xl bg-rose-600 hover:bg-rose-500 text-white font-semibold text-sm transition-colors flex items-center space-x-2"
              >
                <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                <span>Try Again</span>
              </button>
              <button
                onClick={onHome}
                class="px-6 py-3 rounded-xl bg-gray-800 hover:bg-gray-700 text-gray-200 font-semibold text-sm transition-colors flex items-center space-x-2"
              >
                <i data-lucide="home" class="w-4 h-4"></i>
                <span>Main Menu</span>
              </button>
            </div>
          </div>

          {/* Weakness Review Section */}
          {incorrectAnswers.length > 0 && (
            <div class="space-y-4">
              <h3 class="text-lg font-bold text-white flex items-center space-x-2">
                <i data-lucide="alert-circle" class="w-5 h-5 text-rose-400"></i>
                <span>Weakness Review ({incorrectAnswers.length} Missed)</span>
              </h3>

              <div class="space-y-3">
                {incorrectAnswers.map((item, idx) => (
                  <div 
                    key={idx}
                    class="bg-[#1E1E1E] border border-gray-800 rounded-xl p-4 flex items-center justify-between"
                  >
                    <div>
                      <div class="flex items-center space-x-3">
                        <span class="text-lg font-bold text-white">{item.question.kanji}</span>
                        <span class="text-xs text-rose-400 font-mono">{item.question.romaji}</span>
                      </div>
                      <p class="text-sm font-medium text-emerald-400 mt-1">
                        Correct: {item.question.english}
                      </p>
                      <p class="text-xs text-rose-400/80">
                        Selected: {item.selected.english}
                      </p>
                    </div>

                    <button
                      onClick={() => speakText(item.question.kanji)}
                      class="p-2.5 bg-gray-800 hover:bg-rose-600/20 hover:text-rose-400 text-gray-300 rounded-lg transition-colors"
                      title="Listen"
                    >
                      <i data-lucide="volume-2" class="w-4 h-4"></i>
                    </button>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    }

    // Render App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
